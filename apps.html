<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071225">
  <meta name="description" content="Explore apps and digital tools at NKN STORE.">
  <title>Apps — NKN STORE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --app-bg: #071225;
      --app-panel: #0d1b31;
      --app-blue: #278cff;
      --app-text: #f4f8ff;
      --app-muted: #9baec7;
      --app-border: rgba(126,174,232,.17);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: 88px;
      background: var(--app-bg);
      color: var(--app-text);
      font-family: Arial, sans-serif;
    }

    .apps-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(7,18,37,.97);
      border-bottom: 1px solid var(--app-border);
      backdrop-filter: blur(12px);
    }

    .apps-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--app-text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
    }

    .apps-brand b { color: var(--app-blue); }

    .apps-brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #278cff, #1254c9);
      box-shadow: 0 0 20px rgba(39,140,255,.22);
      color: white;
      font-size: 22px;
    }

    .apps-brand small {
      display: block;
      margin-top: 3px;
      color: var(--app-muted);
      font-size: 9px;
      letter-spacing: 1.3px;
    }

    .back-home {
      color: #62b0ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .apps-main {
      width: min(100% - 28px, 1050px);
      margin: 0 auto;
      padding-top: 20px;
    }

    .apps-search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      min-height: 49px;
      background: var(--app-panel);
      border: 1px solid var(--app-border);
      border-radius: 14px;
    }

    .apps-search span { color: #62b0ff; font-size: 20px; }

    .apps-search input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
    }

    .apps-search input::placeholder { color: var(--app-muted); }

    .apps-search button {
      border: 0;
      background: transparent;
      color: var(--app-muted);
      font-size: 22px;
      cursor: pointer;
    }

    /* Apps video carousel: replaces the old image carousel */
    .apps-video-carousel {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid rgba(76,157,255,.35);
      border-radius: 18px;
      background: linear-gradient(145deg, #10213b, #020611);
      box-shadow: 0 12px 32px rgba(0,0,0,.2);
    }

    .apps-video-carousel[hidden] {
      display: none !important;
    }

    .apps-video-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 10px;
    }

    .apps-video-heading span {
      display: block;
      color: #7dbaff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .apps-video-heading h2 {
      margin: 4px 0 0;
      color: var(--app-text);
      font-size: 16px;
      line-height: 1.3;
    }

    .apps-video-count {
      flex: 0 0 auto;
      color: var(--app-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .apps-video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #020611;
    }

    .apps-video-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #020611;
    }

    .apps-video-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      background: rgba(7,18,37,.85);
    }

    .apps-video-nav {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 1px solid #2b4567;
      border-radius: 50%;
      background: #0d1b31;
      color: #cfe4ff;
      font-size: 19px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .apps-video-nav:active {
      background: rgba(39,140,255,.25);
      border-color: var(--app-blue);
    }

    .apps-video-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .apps-video-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: #425674;
      cursor: pointer;
      transition: width .2s, background .2s;
    }

    .apps-video-dot.active {
      width: 22px;
      background: var(--app-blue);
      box-shadow: 0 0 10px rgba(39,140,255,.5);
    }

    .apps-video-note {
      margin: 0;
      padding: 0 12px 10px;
      color: var(--app-muted);
      font-size: 10px;
      text-align: center;
    }

    .apps-status {
      min-height: 20px;
      margin: 20px 2px 12px;
      color: var(--app-muted);
      font-size: 13px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .app-product-card {
      min-width: 0;
      overflow: hidden;
      padding-bottom: 12px;
      background: var(--app-panel);
      border: 1px solid var(--app-border);
      border-radius: 15px;
    }

    .app-product-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #112541;
    }

    .app-product-info { padding: 0 10px; }

    .app-product-name {
      margin: 12px 0 7px;
      color: var(--app-text);
      font-size: 15px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .app-product-description {
      min-height: 18px;
      margin: 0 0 10px;
      color: var(--app-muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .app-product-price {
      margin: 0 0 12px;
      color: #62b0ff;
      font-size: 15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .app-details-button {
      display: block;
      width: 100%;
      padding: 10px 6px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #278cff, #1768dc);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .apps-empty {
      grid-column: 1 / -1;
      padding: 28px 16px;
      text-align: center;
      background: var(--app-panel);
      border: 1px solid var(--app-border);
      border-radius: 15px;
    }

    .apps-empty h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .apps-empty p {
      margin: 0;
      color: var(--app-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .apps-bottom-nav {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
      background: rgba(7,18,37,.97);
      border-top: 1px solid var(--app-border);
      backdrop-filter: blur(12px);
    }

    .apps-bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 43px;
      color: var(--app-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .apps-bottom-nav a span { font-size: 19px; }
    .apps-bottom-nav a.active { color: var(--app-blue); }

    @media (min-width: 650px) {
      .apps-main { padding-top: 26px; }

      .apps-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .app-product-info { padding: 0 12px; }

      .apps-bottom-nav {
        left: 50%;
        right: auto;
        width: min(420px, 100%);
        transform: translateX(-50%);
        border: 1px solid var(--app-border);
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
      }
    }

    @media (max-width: 380px) {
      .apps-video-heading { padding: 10px 11px 8px; }
      .apps-video-heading h2 { font-size: 14px; }
      .apps-video-controls { padding: 9px; gap: 7px; }
      .apps-video-nav { width: 32px; height: 32px; flex-basis: 32px; }
      .apps-video-dots { gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .apps-video-dot { transition: none; }
    }
  </style>
</head>

<body>
  <header class="apps-header">
    <a class="apps-brand" href="index.html">
      <span class="apps-brand-mark">N</span>
      <span>NKN <b>STORE</b><small>YOUR DIGITAL WORLD</small></span>
    </a>
    <a class="back-home" href="index.html">← Games</a>
  </header>

  <main class="apps-main">
    <!-- Search -->
    <label class="apps-search">
      <span aria-hidden="true">⌕</span>
      <input
        id="appsSearch"
        type="search"
        placeholder="Search apps..."
        autocomplete="off"
      >
      <button id="clearAppsSearch" type="button"
        aria-label="Clear search">×</button>
    </label>

    <!-- Videos from Admin Controlroom: Apps Page -->
    <section
      class="apps-video-carousel"
      id="appsVideoCarousel"
      aria-label="Apps page video carousel"
      hidden
    >
      <div class="apps-video-heading">
        <div>
          <span>WATCH & DISCOVER</span>
          <h2>Featured Apps Videos</h2>
        </div>
        <span class="apps-video-count" id="appsVideoCount">0 videos</span>
      </div>

      <div class="apps-video-frame" id="appsVideoFrame">
        <iframe
          id="appsVideoPlayer"
          title="Apps page featured video"
          src="about:blank"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

      <div class="apps-video-controls">
        <button
          class="apps-video-nav"
          id="appsVideoPrevious"
          type="button"
          aria-label="Play previous video"
        >‹</button>

        <div
          class="apps-video-dots"
          id="appsVideoDots"
          aria-label="Choose video"
        ></div>

        <button
          class="apps-video-nav"
          id="appsVideoNext"
          type="button"
          aria-label="Play next video"
        >›</button>
      </div>

      <p class="apps-video-note">
        Swipe left or right to change video
      </p>
    </section>

    <!-- Apps grid starts directly after the video carousel -->
    <p class="apps-status" id="appsStatus" aria-live="polite">
      Loading apps...
    </p>

    <section class="apps-grid" id="appsGrid"
      aria-label="Available apps"></section>
  </main>

  <!-- Bottom navigation -->
  <nav class="apps-bottom-nav" aria-label="Main navigation">
    <a href="index.html">
      <span>🎮</span>Games
    </a>
    <a href="apps.html" class="active" aria-current="page">
      <span>📱</span>Apps
    </a>
    <a href="account.html">
      <span>👤</span>Your Account
    </a>
  </nav>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://qfgzzsiwwrdzsgdkjxgx.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_tJrmszFYYBDt_C9dqKde_Q_GZ6lcLgl";

      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      /* -----------------------------------------
         APPS VIDEO CAROUSEL
         Reads only videos assigned to Apps Page
      ----------------------------------------- */

      const videoArea = document.getElementById("appsVideoCarousel");
      const videoFrame = document.getElementById("appsVideoFrame");
      const videoIframe = document.getElementById("appsVideoPlayer");
      const videoDots = document.getElementById("appsVideoDots");
      const videoCount = document.getElementById("appsVideoCount");
      const previousVideo = document.getElementById("appsVideoPrevious");
      const nextVideo = document.getElementById("appsVideoNext");

      let appVideos = [];
      let currentVideoIndex = 0;
      let ytPlayer = null;
      let ytPlayerReady = false;
      let ytApiReady = Boolean(window.YT && window.YT.Player);
      let pendingAutoplay = false;
      let touchStartX = 0;
      let touchStartY = 0;

      function getYouTubeId(rawUrl) {
        try {
          const url = new URL(String(rawUrl || "").trim());

          const host = url.hostname
            .toLowerCase()
            .replace(/^www\./, "")
            .replace(/^m\./, "");

          let id = "";

          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0] || "";
          } else if (
            host === "youtube.com" ||
            host === "youtube-nocookie.com"
          ) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v") || "";
            } else {
              const parts = url.pathname.split("/").filter(Boolean);

              if (
                ["embed", "shorts", "live", "v"].includes(parts[0])
              ) {
                id = parts[1] || "";
              }
            }
          }

          return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : "";
        } catch (_) {
          return "";
        }
      }

      function getEmbedUrl(videoId, autoplay = false) {
        const params = new URLSearchParams({
          rel: "0",
          playsinline: "1",
          enablejsapi: "1",
          origin: window.location.origin
        });

        if (autoplay) {
          params.set("autoplay", "1");
        }

        return (
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(videoId) +
          "?" +
          params.toString()
        );
      }

      function updateVideoControls() {
        const buttons = videoDots.querySelectorAll(".apps-video-dot");

        buttons.forEach((button, index) => {
          const active = index === currentVideoIndex;

          button.classList.toggle("active", active);
          button.setAttribute("aria-current", active ? "true" : "false");
        });

        videoCount.textContent =
          appVideos.length > 0
            ? `${currentVideoIndex + 1} / ${appVideos.length}`
            : "0 videos";

        const showControls = appVideos.length > 1;

        previousVideo.hidden = !showControls;
        nextVideo.hidden = !showControls;
        videoDots.hidden = !showControls;
      }

      function selectAppVideo(index, autoplay = true) {
        if (!appVideos.length) return;

        currentVideoIndex =
          (index + appVideos.length) % appVideos.length;

        const video = appVideos[currentVideoIndex];

        updateVideoControls();

        if (ytPlayer && ytPlayerReady) {
          if (autoplay) {
            ytPlayer.loadVideoById(video.id);
          } else {
            ytPlayer.cueVideoById(video.id);
          }

          return;
        }

        pendingAutoplay = autoplay;

        /*
          Keep a regular iframe as a fallback while the YouTube
          Player API is loading.
        */
        videoIframe.src = getEmbedUrl(video.id, autoplay);

        if (ytApiReady && !ytPlayer) {
          initializeYouTubePlayer();
        }
      }

      function initializeYouTubePlayer() {
        if (
          !ytApiReady ||
          !appVideos.length ||
          ytPlayer ||
          !videoArea ||
          videoArea.hidden
        ) {
          return;
        }

        const initialVideo = appVideos[currentVideoIndex];

        videoIframe.src = getEmbedUrl(initialVideo.id, false);

        try {
          ytPlayer = new window.YT.Player("appsVideoPlayer", {
            width: "100%",
            height: "100%",
            videoId: initialVideo.id,

            playerVars: {
              playsinline: 1,
              rel: 0,
              enablejsapi: 1
            },

            events: {
              onReady: (event) => {
                ytPlayer = event.target;
                ytPlayerReady = true;

                const selectedVideo = appVideos[currentVideoIndex];

                if (!selectedVideo) return;

                if (pendingAutoplay) {
                  pendingAutoplay = false;
                  ytPlayer.loadVideoById(selectedVideo.id);
                } else {
                  ytPlayer.cueVideoById(selectedVideo.id);
                }
              },

              onStateChange: (event) => {
                /*
                  When a video ends, move to the next one
                  and start playing it.
                */
                if (
                  event.data === window.YT.PlayerState.ENDED &&
                  appVideos.length > 1
                ) {
                  selectAppVideo(currentVideoIndex + 1, true);
                }
              },

              onError: (event) => {
                console.warn(
                  "Apps video could not be played. YouTube error:",
                  event.data
                );
              }
            }
          });
        } catch (error) {
          console.warn("YouTube player could not initialize:", error);
          ytPlayer = null;
        }
      }

      function loadYouTubeApi() {
        if (window.YT && window.YT.Player) {
          ytApiReady = true;
          initializeYouTubePlayer();
          return;
        }

        window.onYouTubeIframeAPIReady = () => {
          ytApiReady = true;
          initializeYouTubePlayer();
        };

        if (!document.querySelector(
          'script[src="https://www.youtube.com/iframe_api"]'
        )) {
          const script = document.createElement("script");
          script.src = "https://www.youtube.com/iframe_api";
          script.async = true;
          script.onerror = () => {
            console.warn("YouTube Player API could not load.");
          };

          document.head.appendChild(script);
        }
      }

      async function loadAppsVideos() {
        try {
          const { data, error } = await db
            .from("video_management")
            .select("youtube_url, sort_order, created_at, is_active")
            .eq("section", "apps")
            .eq("is_active", true)
            .order("sort_order", { ascending: true })
            .order("created_at", { ascending: true });

          if (error) throw error;

          appVideos = (data || [])
            .map((row) => ({
              id: getYouTubeId(row.youtube_url),
              order: Number(row.sort_order) || 0
            }))
            .filter((video) => video.id);

          if (!appVideos.length) {
            videoArea.hidden = true;
            videoIframe.src = "about:blank";
            videoDots.replaceChildren();
            videoCount.textContent = "0 videos";
            return;
          }

          currentVideoIndex = 0;
          videoArea.hidden = false;
          videoDots.replaceChildren();

          appVideos.forEach((video, index) => {
            const dot = document.createElement("button");

            dot.type = "button";
            dot.className =
              "apps-video-dot" + (index === 0 ? " active" : "");

            dot.setAttribute(
              "aria-label",
              `Play video ${index + 1}`
            );

            dot.addEventListener("click", () => {
              selectAppVideo(index, true);
            });

            videoDots.appendChild(dot);
          });

          updateVideoControls();

          /*
            Load video one first without autoplay.
            Users can play it using YouTube's own controls.
          */
          selectAppVideo(0, false);

          loadYouTubeApi();
        } catch (error) {
          console.error("Could not load Apps videos:", error);

          videoArea.hidden = true;
          videoIframe.src = "about:blank";
          videoDots.replaceChildren();
        }
      }

      previousVideo.addEventListener("click", () => {
        selectAppVideo(currentVideoIndex - 1, true);
      });

      nextVideo.addEventListener("click", () => {
        selectAppVideo(currentVideoIndex + 1, true);
      });

      /*
        Swipe on the controls area to change videos.
        The YouTube iframe itself handles its own touch controls.
      */
      const videoControls = videoArea.querySelector(
        ".apps-video-controls"
      );

      videoControls.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      }, { passive: true });

      videoControls.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        const deltaX = touch.screenX - touchStartX;
        const deltaY = touch.screenY - touchStartY;

        if (
          Math.abs(deltaX) > 45 &&
          Math.abs(deltaX) > Math.abs(deltaY) &&
          appVideos.length > 1
        ) {
          selectAppVideo(
            currentVideoIndex + (deltaX < 0 ? 1 : -1),
            true
          );
        }
      }, { passive: true });

      /* -----------------------------------------
         APPS PRODUCT GRID
      ----------------------------------------- */

      const grid = document.getElementById("appsGrid");
      const status = document.getElementById("appsStatus");
      const search = document.getElementById("appsSearch");
      const clearSearch = document.getElementById("clearAppsSearch");

      let apps = [];

      function safe(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function formatPrice(value) {
        if (value === null || value === undefined || value === "") {
          return "Price on request";
        }

        const text = String(value).trim();

        if (!text) return "Price on request";

        return text.startsWith("৳") ? text : `৳ ${text}`;
      }

      function renderApps() {
        const query = (search?.value || "").trim().toLowerCase();

        const filtered = apps.filter((app) => {
          const searchable = [
            app.name,
            app.short_description,
            app.description
          ].join(" ").toLowerCase();

          return searchable.includes(query);
        });

        if (!filtered.length) {
          status.textContent = query
            ? "No apps match your search."
            : "No apps added yet.";

          grid.innerHTML = `
            <div class="apps-empty">
              <h2>${query ? "No results found" : "No apps available yet"}</h2>
              <p>${
                query
                  ? "Try searching with a different keyword."
                  : "Apps added through the store admin will appear here."
              }</p>
            </div>
          `;

          return;
        }

        status.textContent =
          `${filtered.length} app${filtered.length === 1 ? "" : "s"} available`;

        grid.innerHTML = filtered.map((app) => {
          const image = app.image_url || app.details_image_url || "";

          return `
            <article class="app-product-card">
              <img
                class="app-product-image"
                src="${safe(image)}"
                alt="${safe(app.name)}"
                loading="lazy"
                onerror="this.onerror=null;this.style.visibility='hidden';"
              >

              <div class="app-product-info">
                <h2 class="app-product-name">${safe(app.name)}</h2>

                <p class="app-product-description">
                  ${safe(app.short_description || "")}
                </p>

                <p class="app-product-price">
                  ${safe(formatPrice(app.price))}
                </p>

                <button
                  type="button"
                  class="app-details-button"
                  data-app-id="${safe(app.id)}"
                >View Details →</button>
              </div>
            </article>
          `;
        }).join("");
      }

      async function loadApps() {
        status.textContent = "Loading apps...";

        try {
          const { data, error } = await db
            .from("products")
            .select("*")
            .ilike("category", "Apps")
            .order("created_at", { ascending: false });

          if (error) throw error;

          apps = data || [];
          renderApps();
        } catch (error) {
          console.error("Could not load apps:", error);

          status.textContent = "Could not load apps. Please refresh.";

          grid.innerHTML = `
            <div class="apps-empty">
              <h2>Unable to load apps</h2>
              <p>Please check your internet connection and try again.</p>
            </div>
          `;
        }
      }

      if (search) {
        search.addEventListener("input", renderApps);
      }

      if (clearSearch) {
        clearSearch.addEventListener("click", () => {
          if (search) {
            search.value = "";
            search.focus();
          }

          renderApps();
        });
      }

      grid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-app-id]");
        if (!button) return;

        const id = button.dataset.appId;

        window.location.href =
          `product.html?id=${encodeURIComponent(id)}`;
      });

      /* Start loading videos and app products */
      loadAppsVideos();
      loadApps();
    })();
  </script>

  <script src="music.js"></script>
</body>
</html>
