
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071225">
  <title>All Games — NKN STORE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #071225;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px;
      background: #0b1930;
      border-bottom: 1px solid #203653;
    }
    header a { color: #278CFF; text-decoration: none; }
    main { padding: 16px; max-width: 900px; margin: auto; }
    h1 { font-size: 25px; }
    #gamesGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .game-card {
      background: #10213b;
      border: 1px solid #203653;
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 12px;
    }
    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #172943;
    }
    .game-card h3, .game-card p { margin: 10px; overflow-wrap: anywhere; }
    .game-card button {
      margin: 0 10px;
      padding: 9px;
      border: 0;
      border-radius: 7px;
      background: #278CFF;
      color: white;
    }
    #status { color: #b7c9e2; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Back to NKN STORE</a>
  </header>
  <main>
    <h1>🎮 All Games</h1>
    <p id="status">Loading games...</p>
    <section id="gamesGrid"></section>
  </main>

  <script>
    const SUPABASE_URL = "https://qfgzzsiwwrdzsgdkjxgx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tJrmszFYYBDt_C9dqKde_Q_GZ6lcLgl";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const grid = document.getElementById("gamesGrid");
    const status = document.getElementById("status");

    function safe(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    async function loadGames() {
      const { data, error } = await db
        .from("products")
        .select("*")
        .ilike("category", "Games")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Could not load games. Please try again.";
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = "No games added yet.";
        return;
      }

      status.textContent = data.length + " game(s) available";

      grid.innerHTML = data.map(p => `
        <article class="game-card">
          ${p.image_url
            ? `<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`
            : `<div style="aspect-ratio:9/16;background:#172943;display:grid;place-items:center;color:#8dbaff">NKN STORE</div>`}
          <h3>${safe(p.name)}</h3>
          <p>৳${safe(p.price)}</p>
          <p>${safe(p.short_description || "")}</p>
          <button type="button" onclick="showDetails('${safe(p.id)}')">View Details</button>
        </article>
      `).join("");
    }

    function showDetails(id) {
      window.location.href = "index.html?product=" + encodeURIComponent(id);
    }

    loadGames();
  </script>
</body>
  </html>
