
name: Build NKN STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check Android project files
        run: |
          echo "Checking project files..."
          find . -maxdepth 8 -type f | sort
          echo "Project file listing complete."

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Inspect APK contents
        if: always()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK contents..."

          if [ ! -f "$APK" ]; then
            echo "APK file not found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 0
          fi

          echo "APK file details:"
          ls -lh "$APK"
          file "$APK"

          echo "APK contents:"
          unzip -l "$APK" || true

          echo "DEX files:"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex' || true

          echo "Manifest:"
          unzip -l "$APK" | grep AndroidManifest || true

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Checking APK size..."
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small."
            exit 1
          fi

          echo "Checking APK archive..."
          unzip -t "$APK"

          echo "APK verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKN-STORE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
