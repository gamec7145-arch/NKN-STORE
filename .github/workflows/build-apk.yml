      - name: Check Android project files
        run: |
          echo "Checking project files..."
          MISSING=0

          for path in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/nknstore/app/MainActivity.java
          do
            if [ -f "$path" ]; then
              echo "FOUND: $path"
            else
              echo "MISSING: $path"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "All project files found."
