name: Build NKN STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project files
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nknstore/app/MainActivity.java
          echo "All Android project files found."

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK"

          echo "Checking compiled Android code..."
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\.dex$'

          echo "APK verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKN-STORE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
